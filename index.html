<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotizador Chateau Reforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eaed; --panel:#fff; --line:#e2e4e8; --ink:#1a1a2e; --muted:#6b7280;
  --top:#111827; --field:#f6f7f9;
  --wine:#4b0000; --wine2:#6a0f14; --gold:#c5a059; --gold-ink:#8a6b2c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14161b;--panel:#1c1f26;--line:#2c303a;--ink:#eceef2;--muted:#9aa1ae;--top:#0c0e12;--field:#242832;--gold-ink:#d9b873}
}
:root[data-theme="dark"]{--bg:#14161b;--panel:#1c1f26;--line:#2c303a;--ink:#eceef2;--muted:#9aa1ae;--top:#0c0e12;--field:#242832;--gold-ink:#d9b873}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--top);color:#fff;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tb-brand{font-family:'Playfair Display',serif;font-size:15px;font-weight:600}
.tb-brand small{display:block;font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:.18em;text-transform:uppercase;opacity:.5;font-weight:500;margin-top:2px}
.tb-right{font-size:10px;text-align:right;opacity:.7}
.tb-right strong{display:block;font-size:12px;color:#fff}
.wrap{flex:1;display:flex;min-height:0}
.sb{width:310px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:16px 16px 40px}
.slbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.slbl:first-child{margin-top:0}
label{display:block;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;outline:none}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,160,89,.22)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
details{margin-top:14px;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
summary{cursor:pointer;font-size:11px;font-weight:600;color:var(--gold-ink)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.hint{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4}
.main{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;background:var(--wine);color:#fff}
.btn.alt{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{margin:80px auto;text-align:center;color:var(--muted);font-size:13px}
/* ---- hoja ---- */
.sheet{width:100%;max-width:900px;background:#fff;color:#1a1a2e;display:grid;grid-template-columns:300px 1fr;box-shadow:0 8px 30px rgba(0,0,0,.18);border-radius:4px;overflow:hidden}
.sh-l{background:var(--wine);color:#f3e7cc;padding:26px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.sh-l img{width:200px;max-width:100%;height:auto}
.rule{width:60px;height:1px;background:var(--gold)}
.unit-lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.unit-num{font-family:'Playfair Display',serif;font-size:44px;line-height:1;color:#fff}
.unit-niv{font-size:12px;letter-spacing:.1em;color:#e9d9b4}
.specs{width:100%;display:grid;gap:0;margin-top:4px}
.specs div{display:flex;justify-content:space-between;font-size:11.5px;padding:7px 0;border-bottom:1px solid rgba(197,160,89,.28)}
.specs div:last-child{border-bottom:0}
.specs b{color:#fff;font-weight:600}
.adv{margin-top:auto;font-size:10.5px;line-height:1.6;color:#d8c79c}
.adv strong{display:block;color:#fff;font-size:12px}
.sh-r{padding:26px 30px;display:flex;flex-direction:column;gap:16px}
.sh-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid var(--gold);padding-bottom:10px}
.sh-h h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:var(--wine)}
.sh-h span{font-size:10.5px;color:#6b7280}
.cli{font-size:11.5px;line-height:1.6}
.cli b{font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:9px 6px;border-bottom:1px solid #eceef1;vertical-align:top}
td.n{text-align:right;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;font-size:10.5px;color:#6b7280;font-weight:400;margin-top:2px}
tr.price td{background:#faf5e8;font-weight:700;font-size:13.5px}
tr.firma td{background:#f7f1f1;font-weight:700}
.bank{border:1px solid #e3d3a9;background:#fffdf7;border-radius:6px;padding:12px 14px;font-size:11.5px;line-height:1.7}
.bank h4{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#8a6b2c;margin-bottom:4px}
.bank b{font-weight:600}
.clabe{font-variant-numeric:tabular-nums;letter-spacing:.04em}
.note{font-size:9.5px;color:#6b7280;line-height:1.5}
@media (max-width:860px){
  .wrap{flex-direction:column}.sb{width:100%;border-right:0;border-bottom:1px solid var(--line)}
  .sheet{grid-template-columns:1fr}.main{padding:14px 12px}.sh-r{padding:20px 16px}
}
@media print{
  @page{size:letter landscape;margin:8mm}
  body{background:#fff;display:block}
  .topbar,.sb,.actions,.empty{display:none!important}
  .main{padding:0}.sheet{box-shadow:none;max-width:none;border-radius:0;grid-template-columns:270px 1fr;
    -webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-brand">José Metta Inmobiliaria<small>Cotizador · Chateau Reforma</small></div>
  <div class="tb-right"><strong id="tbName">José Metta</strong>Asesor de ventas</div>
</header>
<div class="wrap">
  <aside class="sb">
    <div class="slbl">Asesor</div>
    <label for="aNombre">Nombre</label><input id="aNombre" value="José Metta">
    <div class="row">
      <div><label for="aTel">Teléfono</label><input id="aTel" value="55 6783 2774" inputmode="tel"></div>
      <div><label for="fecha">Fecha</label><input id="fecha" type="date"></div>
    </div>

    <div class="slbl">Cliente</div>
    <label for="cNombre">Nombre completo</label><input id="cNombre" placeholder="Nombre del cliente">
    <div class="row">
      <div><label for="cTel">Teléfono</label><input id="cTel" placeholder="55 0000 0000" inputmode="tel"></div>
      <div><label for="cMail">Correo</label><input id="cMail" placeholder="correo@email.com" type="email"></div>
    </div>

    <div class="slbl">Departamento</div>
    <label for="depto">Disponibles (<span id="cnt"></span>)</label>
    <select id="depto"><option value="">— Seleccionar —</option></select>

    <details>
      <summary>Ajustar plan de pago</summary>
      <div class="row3">
        <div><label for="pEng">Enganche %</label><input id="pEng" type="number" step="0.01" min="0" value="7"></div>
        <div><label for="pDif">Diferido %</label><input id="pDif" type="number" step="0.01" min="0" value="8"></div>
        <div><label for="pMes">Meses</label><input id="pMes" type="number" step="1" min="1" value="44"></div>
      </div>
      <p class="hint">El pago a la firma es el resto: <b id="pFirmaPct">85</b>%.</p>
    </details>
  </aside>

  <main class="main">
    <div class="actions">
      <button class="btn" id="bPrint" disabled>Imprimir / Guardar PDF</button>
      <button class="btn alt" id="bCopy" disabled>Copiar resumen</button>
    </div>
    <div id="out"><div class="empty">Selecciona un departamento para generar la cotización.</div></div>
  </main>
</div>

const BANCO = { banco:"Banregio", clabe:"058585016100002294", beneficiario:"BAHIA LUXE SA DE CV" };
const DISPONIBILIDAD = "7 de septiembre de 2026";

const $ = id => document.getElementById(id);
const mxn = n => new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n);
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const m2 = n => (Math.round(n*100)/100).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = n => (Math.round(n*100)/100).toString();

let last = null; // último cálculo, para copiar

function init(){
  const d = new Date(); const off = d.getTimezoneOffset()*60000;
  $('fecha').value = new Date(d - off).toISOString().slice(0,10);
  $('cnt').textContent = UNITS.length;
  const byN = {};
  UNITS.forEach(u => (byN[u.n] = byN[u.n] || []).push(u));
  const sel = $('depto');
  Object.keys(byN).map(Number).sort((a,b)=>a-b).forEach(n => {
    const g = document.createElement('optgroup'); g.label = 'Nivel ' + n;
    byN[n].forEach(u => {
      const o = document.createElement('option'); o.value = u.d;
      o.textContent = `${u.d} · ${m2(u.t)} m² · ${mxn(u.p).replace(/\.00$/,'')}`;
      g.appendChild(o);
    });
    sel.appendChild(g);
  });
  ['aNombre','aTel','fecha','cNombre','cTel','cMail','depto','pEng','pDif','pMes'].forEach(id => {
    $(id).addEventListener('input', render);
  });
  $('bPrint').onclick = () => window.print();
  $('bCopy').onclick = copySummary;
  render();
}

function calc(u){
  const eng = +$('pEng').value || 0, dif = +$('pDif').value || 0, mes = Math.max(1, Math.round(+$('pMes').value || 1));
  const price = u.p;
  const enganche = r2(price * eng/100);
  const diferido = r2(price * dif/100);
  const mensualidad = r2(diferido / mes);
  const firma = r2(price - enganche - diferido);
  return { eng, dif, mes, price, enganche, diferido, mensualidad, firma, firmaPct: r2(100 - eng - dif) };
}

function fechaLarga(v){
  if(!v) return '';
  const [y,m,d] = v.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
}

function render(){
  $('tbName').textContent = $('aNombre').value || 'Asesor';
  const eng = +$('pEng').value || 0, dif = +$('pDif').value || 0;
  $('pFirmaPct').textContent = pct(100 - eng - dif);
  const u = UNITS.find(x => x.d === $('depto').value);
  $('bPrint').disabled = $('bCopy').disabled = !u;
  if(!u){ last = null; $('out').innerHTML = '<div class="empty">Selecciona un departamento para generar la cotización.</div>'; return; }
  const c = calc(u);
  const warn = c.firmaPct < 0;
  const cli = $('cNombre').value.trim();
  const tel = $('cTel').value.trim(), mail = $('cMail').value.trim();
  last = { u, c, cli };
  $('out').innerHTML = `
  <section class="sheet" id="sheet">
    <div class="sh-l">
      <img src="${LOGO}" alt="Château Reforma">
      <div class="rule"></div>
      <div class="unit-lbl">Departamento</div>
      <div class="unit-num">${esc(u.d)}</div>
      <div class="unit-niv">NIVEL ${u.n}</div>
      <div class="specs">
        <div><span>Interior</span><b>${m2(u.i)} m²</b></div>
        <div><span>Balcón</span><b>${m2(u.b)} m²</b></div>
        <div><span>Total</span><b>${m2(u.t)} m²</b></div>
        <div><span>Precio por m²</span><b>${mxn(u.p/u.t).replace(/\.\d\d$/,'')}</b></div>
      </div>
      <div class="adv"><strong>${esc($('aNombre').value)}</strong>Asesor de ventas${$('aTel').value ? '<br>'+esc($('aTel').value) : ''}</div>
    </div>
    <div class="sh-r">
      <div class="sh-h"><h2>Cotización</h2><span>${esc(fechaLarga($('fecha').value))}</span></div>
      <div class="cli">
        <b>Cliente:</b> ${cli ? esc(cli) : '—'}
        ${tel ? ' &nbsp;·&nbsp; ' + esc(tel) : ''}${mail ? ' &nbsp;·&nbsp; ' + esc(mail) : ''}
      </div>
      <table>
        <tr class="price"><td>Precio de venta</td><td class="n">${mxn(c.price)}</td></tr>
        <tr><td>Enganche ${pct(c.eng)}%</td><td class="n">${mxn(c.enganche)}</td></tr>
        <tr><td>${pct(c.dif)}% diferido a ${c.mes} meses<small>Total diferido</small></td><td class="n">${mxn(c.diferido)}</td></tr>
        <tr><td>Mensualidad<small>${c.mes} pagos mensuales</small></td><td class="n">${mxn(c.mensualidad)}</td></tr>
        <tr class="firma"><td>Pago a la firma ${pct(c.firmaPct)}%${warn?' <small>Revisa los porcentajes: suman más de 100%</small>':''}</td><td class="n">${mxn(c.firma)}</td></tr>
      </table>
      <div class="bank">
        <h4>Datos para depósito</h4>
        <div><b>Banco:</b> ${esc(BANCO.banco)}</div>
        <div><b>CLABE:</b> <span class="clabe">${esc(BANCO.clabe)}</span></div>
        <div><b>Beneficiario:</b> ${esc(BANCO.beneficiario)}</div>
      </div>
      <p class="note">Cotización informativa. Precios y disponibilidad según lista del ${DISPONIBILIDAD}, sujetos a cambio sin previo aviso. Las superficies son aproximadas.</p>
    </div>
  </section>`;
}

function copySummary(){
  if(!last) return;
  const {u,c,cli} = last;
  const t = [
    `*Chateau Reforma · Depto ${u.d} (Nivel ${u.n})*`,
    cli ? `Cliente: ${cli}` : null,
    `${m2(u.t)} m² (${m2(u.i)} interior + ${m2(u.b)} balcón)`,
    ``,
    `Precio de venta: ${mxn(c.price)}`,
    `Enganche ${pct(c.eng)}%: ${mxn(c.enganche)}`,
    `${pct(c.dif)}% diferido a ${c.mes} meses: ${mxn(c.diferido)}`,
    `Mensualidad: ${mxn(c.mensualidad)}`,
    `Pago a la firma ${pct(c.firmaPct)}%: ${mxn(c.firma)}`,
    ``,
    `Depósito: ${BANCO.banco} · CLABE ${BANCO.clabe} · ${BANCO.beneficiario}`
  ].filter(x => x !== null).join('\n');
  const done = () => { const b = $('bCopy'); const o = b.textContent; b.textContent = '¡Copiado!'; setTimeout(()=> b.textContent = o, 1500); };
  const fallback = () => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
    try{ document.execCommand('copy'); done(); }catch(e){ $('bCopy').textContent='No se pudo copiar'; } a.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();
}
init();
</script>
